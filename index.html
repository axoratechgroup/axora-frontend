<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="description" content="AXORA — Tu cuenta global multi-moneda con cálculo y liquidación de gastos compartidos cross-currency para viajeros y nómadas digitales." />
    <meta name="theme-color" content="#1C1917" />
    <title>AXORA — Tu cuenta global multi-moneda</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          document.documentElement.setAttribute('data-theme', saved === 'light' ? 'light' : 'dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
